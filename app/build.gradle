plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sadhana.tracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sadhana.tracker'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    // Fixed key so every build (local or GitHub) can update the installed app.
    // For Play Store publishing, create a private key and keep it out of the repo.
    signingConfigs {
        release {
            storeFile file('sadhana-release.keystore')
            storePassword 'sadhana-app-key'
            keyAlias 'sadhana'
            keyPassword 'sadhana-app-key'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
